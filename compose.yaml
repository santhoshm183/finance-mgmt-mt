services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-finance_mgmt}
      POSTGRES_USER: ${SUPABASE_DB_USERNAME:?Set SUPABASE_DB_USERNAME in your environment}
      POSTGRES_PASSWORD: ${SUPABASE_DB_PASSWORD:?Set SUPABASE_DB_PASSWORD in your environment}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - finance-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finance-postgres-data:
