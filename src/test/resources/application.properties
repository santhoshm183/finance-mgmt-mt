spring.datasource.url=jdbc:h2:mem:finance_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS finance_mgmt
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jpa.properties.hibernate.default_schema=finance_mgmt
spring.flyway.schemas=finance_mgmt
spring.flyway.default-schema=finance_mgmt
